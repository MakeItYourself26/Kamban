<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kanban - Proyecto LMS</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .kanban-column {
      min-height: 450px;
    }

    .task-card {
      cursor: grab;
    }

    .task-card:active {
      cursor: grabbing;
    }

    .drag-over {
      border: 2px dashed #6366f1;
      background: #eef2ff;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- =========================
       ENCABEZADO
  ========================== -->
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-6 py-5">

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

        <div>
          <h1 class="text-3xl font-bold text-gray-800">
            Kanban - Proyecto LMS
          </h1>

          <p class="text-gray-500 mt-1">
            Organización y seguimiento de tareas
          </p>
        </div>

        <!-- BOTÓN AGREGAR TAREA -->
        <button
          id="addTaskButton"
          type="button"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg shadow transition"
        >
          + Agregar tarea
        </button>

      </div>

    </div>
  </header>


  <!-- =========================
       MENSAJES
  ========================== -->
  <div
    id="message"
    class="hidden max-w-7xl mx-auto px-6 mt-5"
  >
    <div
      id="messageContent"
      class="rounded-lg px-4 py-3 font-medium"
    ></div>
  </div>


  <!-- =========================
       TABLERO KANBAN
  ========================== -->

  <main class="max-w-7xl mx-auto px-4 md:px-6 py-8">

    <div
      id="kanbanBoard"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-5"
    >

      <!-- BACKLOG -->
      <section class="bg-gray-200 rounded-xl p-4">

        <div class="flex justify-between items-center mb-4">

          <h2 class="font-bold text-gray-800">
            Backlog
          </h2>

          <span
            id="countBacklog"
            class="bg-gray-300 px-2 py-1 rounded-full text-xs font-bold"
          >
            0
          </span>

        </div>

        <div
          id="backlog"
          class="kanban-column space-y-3 rounded-lg p-1"
          data-status="Backlog"
        ></div>

      </section>


      <!-- ASIGNADO -->
      <section class="bg-blue-100 rounded-xl p-4">

        <div class="flex justify-between items-center mb-4">

          <h2 class="font-bold text-gray-800">
            Asignado a
          </h2>

          <span
            id="countAsignado"
            class="bg-blue-200 text-blue-800 px-2 py-1 rounded-full text-xs font-bold"
          >
            0
          </span>

        </div>

        <div
          id="asignado"
          class="kanban-column space-y-3 rounded-lg p-1"
          data-status="Asignado a"
        ></div>

      </section>


      <!-- EN PROGRESO -->
      <section class="bg-yellow-100 rounded-xl p-4">

        <div class="flex justify-between items-center mb-4">

          <h2 class="font-bold text-gray-800">
            En progreso
          </h2>

          <span
            id="countProgreso"
            class="bg-yellow-200 text-yellow-800 px-2 py-1 rounded-full text-xs font-bold"
          >
            0
          </span>

        </div>

        <div
          id="progreso"
          class="kanban-column space-y-3 rounded-lg p-1"
          data-status="En progreso"
        ></div>

      </section>


      <!-- EN REVISIÓN -->
      <section class="bg-purple-100 rounded-xl p-4">

        <div class="flex justify-between items-center mb-4">

          <h2 class="font-bold text-gray-800">
            En revisión
          </h2>

          <span
            id="countRevision"
            class="bg-purple-200 text-purple-800 px-2 py-1 rounded-full text-xs font-bold"
          >
            0
          </span>

        </div>

        <div
          id="revision"
          class="kanban-column space-y-3 rounded-lg p-1"
          data-status="En revisión"
        ></div>

      </section>


      <!-- FINALIZADO -->
      <section class="bg-green-100 rounded-xl p-4">

        <div class="flex justify-between items-center mb-4">

          <h2 class="font-bold text-gray-800">
            Finalizado
          </h2>

          <span
            id="countFinalizado"
            class="bg-green-200 text-green-800 px-2 py-1 rounded-full text-xs font-bold"
          >
            0
          </span>

        </div>

        <div
          id="finalizado"
          class="kanban-column space-y-3 rounded-lg p-1"
          data-status="Finalizado"
        ></div>

      </section>

    </div>

  </main>


  <!-- ==================================================
       MODAL PARA AGREGAR / EDITAR TAREA
  =================================================== -->

  <div
    id="taskModal"
    class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4"
  >

    <div
      class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto"
    >

      <!-- CABECERA -->
      <div class="flex justify-between items-center p-6 border-b">

        <div>
          <h2
            id="modalTitle"
            class="text-2xl font-bold text-gray-800"
          >
            Agregar tarea
          </h2>

          <p class="text-sm text-gray-500 mt-1">
            Completa la información de la tarea
          </p>
        </div>

        <button
          id="closeModal"
          type="button"
          class="text-gray-400 hover:text-gray-700 text-3xl"
        >
          &times;
        </button>

      </div>


      <!-- ==================================================
           FORMULARIO
      =================================================== -->

      <form
        id="taskForm"
        class="p-6 space-y-5"
      >

        <!-- ID OCULTO -->
        <input
          type="hidden"
          id="taskId"
        >


        <!-- TÍTULO -->
        <div>

          <label
            for="title"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Nombre de la tarea *
          </label>

          <input
            type="text"
            id="title"
            required
            placeholder="Ej: Diseñar la página principal"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          >

        </div>


        <!-- DESCRIPCIÓN -->
        <div>

          <label
            for="description"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Descripción
          </label>

          <textarea
            id="description"
            rows="4"
            placeholder="Describe lo que se debe realizar..."
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          ></textarea>

        </div>


        <!-- RESPONSABLE -->
        <div>

          <label
            for="responsible"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Responsable *
          </label>

          <select
            id="responsible"
            required
            class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          >

            <option value="">
              Selecciona un responsable
            </option>

            <option value="Valentina">
              Valentina
            </option>

            <option value="Daniel">
              Daniel
            </option>

            <option value="Isabella">
              Isabella
            </option>

            <option value="Breiner">
              Breiner
            </option>

          </select>

        </div>


        <!-- FECHAS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <div>

            <label
              for="startDate"
              class="block text-sm font-semibold text-gray-700 mb-2"
            >
              Fecha de inicio
            </label>

            <input
              type="date"
              id="startDate"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            >

          </div>


          <div>

            <label
              for="endDate"
              class="block text-sm font-semibold text-gray-700 mb-2"
            >
              Fecha de finalización
            </label>

            <input
              type="date"
              id="endDate"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            >

          </div>

        </div>


        <!-- URL -->
        <div>

          <label
            for="deliverable"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            URL del entregable
          </label>

          <input
            type="url"
            id="deliverable"
            placeholder="https://drive.google.com/..."
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          >

        </div>


        <!-- ESTADO -->
        <div>

          <label
            for="status"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Estado
          </label>

          <select
            id="status"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          >

            <option value="Backlog">
              Backlog
            </option>

            <option value="Asignado a">
              Asignado a
            </option>

            <option value="En progreso">
              En progreso
            </option>

            <option value="En revisión">
              En revisión
            </option>

            <option value="Finalizado">
              Finalizado
            </option>

          </select>

        </div>


        <!-- BOTONES -->
        <div class="flex justify-end gap-3 pt-5 border-t">

          <button
            type="button"
            id="cancelButton"
            class="px-5 py-3 rounded-lg border border-gray-300 hover:bg-gray-100 font-semibold text-gray-700"
          >
            Cancelar
          </button>

          <button
            type="submit"
            id="submitTask"
            class="px-6 py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold"
          >
            Agregar tarea
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =========================
       APP.JS
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
