<!DOCTYPE html>

<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kanban LMS</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .dragging {
      opacity: 0.45;
      transform: rotate(2deg);
    }

    .drop-zone {
      background-color: rgba(59, 130, 246, 0.08);
      border: 2px dashed rgba(59, 130, 246, 0.35);
    }

    .kanban-column {
      min-height: 520px;
    }

    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>

</head>

<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- HEADER -->

  <header class="bg-white border-b border-slate-200">

```
<div
  class="max-w-[1800px] mx-auto px-5 md:px-8 py-5
         flex flex-col md:flex-row
         md:items-center md:justify-between gap-4"
>

  <div>
    <h1 class="text-2xl md:text-3xl font-bold">
      Kanban LMS
    </h1>

    <p class="text-sm text-slate-500 mt-1">
      Organización y seguimiento del proyecto
    </p>
  </div>

  <button
    onclick="openCreateModal()"
    class="bg-slate-900 hover:bg-slate-700
           text-white px-5 py-2.5 rounded-xl
           font-medium transition shadow-sm"
  >
    + Nueva tarea
  </button>

</div>
```

  </header>

  <!-- TABLERO -->

  <main class="max-w-[1800px] mx-auto px-4 md:px-8 py-6">

```
<div
  id="loading"
  class="text-center text-slate-500 py-10"
>
  Cargando tareas...
</div>

<div
  id="board"
  class="hidden grid grid-cols-1 md:grid-cols-2
         xl:grid-cols-5 gap-4"
>
</div>
```

  </main>

  <!-- MODAL -->

  <div
    id="modal"
    class="hidden fixed inset-0 bg-black/40
           z-50 items-center justify-center p-4"
  >

```
<div
  class="bg-white rounded-2xl shadow-2xl
         w-full max-w-lg max-h-[90vh]
         overflow-y-auto p-6"
>

  <div class="flex items-center justify-between mb-5">

    <div>
      <h2
        id="modalTitle"
        class="text-xl font-bold"
      >
        Nueva tarea
      </h2>

      <p class="text-xs text-slate-500 mt-1">
        Completa la información de la actividad
      </p>
    </div>

    <button
      onclick="closeModal()"
      class="text-slate-400 hover:text-slate-800
             text-2xl leading-none"
    >
      ×
    </button>

  </div>


  <form id="taskForm" class="space-y-4">

    <input
      type="hidden"
      id="taskId"
    >


    <!-- TÍTULO -->
    <div>

      <label class="text-sm font-medium">
        Nombre / Título
      </label>

      <input
        id="titulo"
        required
        placeholder="Ej. Diseñar página principal"
        class="mt-1 w-full border border-slate-300
               rounded-xl px-3 py-2.5
               outline-none focus:ring-2
               focus:ring-slate-300"
      >

    </div>


    <!-- DESCRIPCIÓN -->
    <div>

      <label class="text-sm font-medium">
        Descripción
      </label>

      <textarea
        id="descripcion"
        rows="4"
        placeholder="Describe la actividad..."
        class="mt-1 w-full border border-slate-300
               rounded-xl px-3 py-2.5
               outline-none focus:ring-2
               focus:ring-slate-300"
      ></textarea>

    </div>


    <!-- RESPONSABLE -->
    <div>

      <label class="text-sm font-medium">
        Responsable
      </label>

      <select
        id="responsable"
        class="mt-1 w-full border border-slate-300
               rounded-xl px-3 py-2.5"
      >

        <option value="">
          Sin asignar
        </option>

        <option value="Valentina">
          Valentina
        </option>

        <option value="Daniel">
          Daniel
        </option>

        <option value="Isabella">
          Isabella
        </option>

        <option value="Breiner">
          Breiner
        </option>

      </select>

    </div>


    <!-- FECHAS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

      <div>

        <label class="text-sm font-medium">
          Fecha de inicio
        </label
```
