<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kanban - Proyecto LMS</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .kanban-column {
      min-height: 500px;
    }

    .task-card {
      cursor: grab;
    }

    .task-card:active {
      cursor: grabbing;
    }

    .drag-over {
      border: 2px dashed #6366f1;
      background-color: #eef2ff;
    }

    .modal-hidden {
      display: none !important;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- ENCABEZADO -->
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-6 py-5">

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

        <div>
          <h1 class="text-3xl font-bold text-gray-800">
            Kanban - Proyecto LMS
          </h1>

          <p class="text-gray-500 mt-1">
            Organización y seguimiento de tareas del equipo
          </p>
        </div>

        <button
          id="newTaskBtn"
          type="button"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-3 rounded-lg shadow transition"
        >
          + Nueva tarea
        </button>

      </div>

    </div>
  </header>


  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 md:px-6 py-8">

    <!-- MENSAJE DE ESTADO -->
    <div
      id="statusMessage"
      class="hidden mb-6 rounded-lg px-4 py-3 text-sm font-medium"
    ></div>


    <!-- TABLERO -->
    <div
      id="kanbanBoard"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4"
    >

      <!-- BACKLOG -->
      <section
        class="bg-gray-200 rounded-xl p-4"
      >
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-gray-800">
            Backlog
          </h2>

          <span
            id="count-backlog"
            class="bg-gray-300 text-gray-700 text-xs font-bold px-2 py-1 rounded-full"
          >
            0
          </span>
        </div>

        <div
          id="column-backlog"
          class="kanban-column space-y-3 rounded-lg p-1 transition"
          data-status="Backlog"
        ></div>
      </section>


      <!-- ASIGNADO A -->
      <section
        class="bg-blue-100 rounded-xl p-4"
      >
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-gray-800">
            Asignado a
          </h2>

          <span
            id="count-asignado"
            class="bg-blue-200 text-blue-800 text-xs font-bold px-2 py-1 rounded-full"
          >
            0
          </span>
        </div>

        <div
          id="column-asignado"
          class="kanban-column space-y-3 rounded-lg p-1 transition"
          data-status="Asignado a"
        ></div>
      </section>


      <!-- EN PROGRESO -->
      <section
        class="bg-yellow-100 rounded-xl p-4"
      >
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-gray-800">
            En progreso
          </h2>

          <span
            id="count-progreso"
            class="bg-yellow-200 text-yellow-800 text-xs font-bold px-2 py-1 rounded-full"
          >
            0
          </span>
        </div>

        <div
          id="column-progreso"
          class="kanban-column space-y-3 rounded-lg p-1 transition"
          data-status="En progreso"
        ></div>
      </section>


      <!-- EN REVISIÓN -->
      <section
        class="bg-purple-100 rounded-xl p-4"
      >
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-gray-800">
            En revisión
          </h2>

          <span
            id="count-revision"
            class="bg-purple-200 text-purple-800 text-xs font-bold px-2 py-1 rounded-full"
          >
            0
          </span>
        </div>

        <div
          id="column-revision"
          class="kanban-column space-y-3 rounded-lg p-1 transition"
          data-status="En revisión"
        ></div>
      </section>


      <!-- FINALIZADO -->
      <section
        class="bg-green-100 rounded-xl p-4"
      >
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-gray-800">
            Finalizado
          </h2>

          <span
            id="count-finalizado"
            class="bg-green-200 text-green-800 text-xs font-bold px-2 py-1 rounded-full"
          >
            0
          </span>
        </div>

        <div
          id="column-finalizado"
          class="kanban-column space-y-3 rounded-lg p-1 transition"
          data-status="Finalizado"
        ></div>
      </section>

    </div>

  </main>


  <!-- MODAL NUEVA TAREA / EDITAR -->
  <div
    id="taskModal"
    class="modal-hidden fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4"
  >

    <div
      class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"
    >

      <!-- CABECERA MODAL -->
      <div class="flex items-center justify-between px-6 py-5 border-b">

        <div>
          <h2
            id="modalTitle"
            class="text-2xl font-bold text-gray-800"
          >
            Nueva tarea
          </h2>

          <p class="text-sm text-gray-500 mt-1">
            Completa la información de la tarea
          </p>
        </div>

        <button
          id="closeModalBtn"
          type="button"
          class="text-gray-400 hover:text-gray-700 text-3xl leading-none"
        >
          &times;
        </button>

      </div>


      <!-- FORMULARIO -->
      <form
        id="taskForm"
        class="p-6 space-y-5"
      >

        <!-- ID OCULTO -->
        <input
          type="hidden"
          id="taskId"
          name="taskId"
        >


        <!-- TÍTULO -->
        <div>
          <label
            for="titulo"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Título / Nombre
          </label>

          <input
            type="text"
            id="titulo"
            name="titulo"
            required
            placeholder="Ej: Diseñar página de inicio"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
        </div>


        <!-- DESCRIPCIÓN -->
        <div>
          <label
            for="descripcion"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Descripción
          </label>

          <textarea
            id="descripcion"
            name="descripcion"
            rows="4"
            placeholder="Describe qué se debe realizar..."
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          ></textarea>
        </div>


        <!-- RESPONSABLE -->
        <div>
          <label
            for="responsable"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Responsable
          </label>

          <select
            id="responsable"
            name="responsable"
            required
            class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="">Seleccionar responsable</option>
            <option value="Valentina">Valentina</option>
            <option value="Daniel">Daniel</option>
            <option value="Isabella">Isabella</option>
            <option value="Breiner">Breiner</option>
          </select>
        </div>


        <!-- FECHAS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <div>
            <label
              for="fechaInicio"
              class="block text-sm font-semibold text-gray-700 mb-2"
            >
              Fecha de inicio
            </label>

            <input
              type="date"
              id="fechaInicio"
              name="fechaInicio"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
          </div>


          <div>
            <label
              for="fechaFin"
              class="block text-sm font-semibold text-gray-700 mb-2"
            >
              Fecha de finalización
            </label>

            <input
              type="date"
              id="fechaFin"
              name="fechaFin"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
          </div>

        </div>


        <!-- URL -->
        <div>
          <label
            for="url"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            URL del entregable
          </label>

          <input
            type="url"
            id="url"
            name="url"
            placeholder="https://..."
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
        </div>


        <!-- ESTADO -->
        <div>
          <label
            for="estado"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Estado
          </label>

          <select
            id="estado"
            name="estado"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="Backlog">Backlog</option>
            <option value="Asignado a">Asignado a</option>
            <option value="En progreso">En progreso</option>
            <option value="En revisión">En revisión</option>
            <option value="Finalizado">Finalizado</option>
          </select>
        </div>


        <!-- BOTONES -->
        <div class="flex justify-end gap-3 pt-4 border-t">

          <button
            type="button"
            id="cancelModalBtn"
            class="px-5 py-3 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 font-semibold"
          >
            Cancelar
          </button>

          <button
            type="submit"
            id="saveTaskBtn"
            class="px-5 py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold"
          >
            Guardar tarea
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- JAVASCRIPT -->
  <script src="app.js"></script>

</body>
</html>
